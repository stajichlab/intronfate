# Environment for the V13 tables and figures (numpy + matplotlib); intronfate itself is the repository's release binary.
[workspace]
name = "v13-alith-intron-map"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.26"
matplotlib = ">=3.8"
